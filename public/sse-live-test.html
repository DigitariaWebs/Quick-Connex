<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSE Live Test - Real-time Notifications</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }

      .container {
        background: white;
        border-radius: 15px;
        padding: 30px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 2px solid #f0f0f0;
      }

      .header h1 {
        color: #333;
        margin: 0;
        font-size: 2.5em;
        background: linear-gradient(45deg, #667eea, #764ba2);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .status {
        padding: 15px;
        margin: 15px 0;
        border-radius: 8px;
        font-weight: bold;
        text-align: center;
        transition: all 0.3s ease;
      }

      .status.success {
        background: linear-gradient(135deg, #d4edda, #c3e6cb);
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .status.error {
        background: linear-gradient(135deg, #f8d7da, #f5c6cb);
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .status.info {
        background: linear-gradient(135deg, #d1ecf1, #bee5eb);
        color: #0c5460;
        border: 1px solid #bee5eb;
      }

      .status.warning {
        background: linear-gradient(135deg, #fff3cd, #ffeaa7);
        color: #856404;
        border: 1px solid #ffeaa7;
      }

      .test-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 20px;
        margin: 30px 0;
      }

      .test-section {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 20px;
        border: 1px solid #e9ecef;
        transition: transform 0.2s ease;
      }

      .test-section:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      .test-section h3 {
        margin: 0 0 15px 0;
        color: #495057;
        font-size: 1.2em;
      }

      button {
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
        margin: 5px;
        font-weight: 600;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      }

      button:disabled {
        background: #6c757d;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      input {
        padding: 12px;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        margin: 5px;
        width: 200px;
        transition: border-color 0.3s ease;
      }

      input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .log {
        background: #1e1e1e;
        color: #f8f9fa;
        border-radius: 8px;
        padding: 20px;
        max-height: 400px;
        overflow-y: auto;
        font-family: "Courier New", monospace;
        font-size: 14px;
        line-height: 1.4;
        margin: 20px 0;
      }

      .log-entry {
        margin: 5px 0;
        padding: 5px 0;
        border-bottom: 1px solid #333;
      }

      .log-entry:last-child {
        border-bottom: none;
      }

      .log-timestamp {
        color: #6c757d;
        font-size: 12px;
      }

      .log-message {
        color: #f8f9fa;
      }

      .log-success {
        color: #28a745;
      }

      .log-error {
        color: #dc3545;
      }

      .log-warning {
        color: #ffc107;
      }

      .log-info {
        color: #17a2b8;
      }

      .connection-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        margin: 20px 0;
      }

      .stat-card {
        background: linear-gradient(135deg, #f8f9fa, #e9ecef);
        padding: 15px;
        border-radius: 8px;
        text-align: center;
        border: 1px solid #dee2e6;
      }

      .stat-value {
        font-size: 2em;
        font-weight: bold;
        color: #495057;
      }

      .stat-label {
        color: #6c757d;
        font-size: 0.9em;
        margin-top: 5px;
      }

      .notification-popup {
        position: fixed;
        top: 20px;
        right: 20px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        padding: 20px;
        max-width: 350px;
        z-index: 1000;
        animation: slideIn 0.3s ease-out;
        border-left: 4px solid #667eea;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateX(100%);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .notification-title {
        font-weight: bold;
        color: #333;
        margin-bottom: 8px;
      }

      .notification-message {
        color: #666;
        font-size: 0.9em;
        margin-bottom: 10px;
      }

      .notification-time {
        color: #999;
        font-size: 0.8em;
      }

      .close-btn {
        position: absolute;
        top: 10px;
        right: 10px;
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
        color: #999;
        padding: 0;
        width: 20px;
        height: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🧪 SSE Live Test</h1>
        <p>Real-time notification system testing interface</p>
      </div>

      <div id="status" class="status info">Ready to test SSE system</div>

      <div class="connection-stats">
        <div class="stat-card">
          <div class="stat-value" id="connectionCount">0</div>
          <div class="stat-label">Connections</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="messageCount">0</div>
          <div class="stat-label">Messages</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="notificationCount">0</div>
          <div class="stat-label">Notifications</div>
        </div>
      </div>

      <div class="test-grid">
        <div class="test-section">
          <h3>🔐 Authentication</h3>
          <input
            type="email"
            id="email"
            placeholder="Email"
            value="arselene.tests@gmail.com"
          />
          <input
            type="password"
            id="password"
            placeholder="Password"
            value="TestPassword123!"
          />
          <br />
          <button onclick="login()">Login</button>
          <button onclick="logout()">Logout</button>
        </div>

        <div class="test-section">
          <h3>🔗 SSE Connection</h3>
          <button onclick="connectSSE()" id="connectBtn">Connect SSE</button>
          <button onclick="disconnectSSE()" id="disconnectBtn" disabled>
            Disconnect SSE
          </button>
          <button onclick="testConnection()" id="testBtn" disabled>
            Test Connection
          </button>
          <button onclick="checkStatus()" id="statusBtn" disabled>
            Check Status
          </button>
        </div>

        <div class="test-section">
          <h3>📢 Test Notifications</h3>
          <button onclick="sendTestNotification('test')" id="basicBtn" disabled>
            Basic Test
          </button>
          <button
            onclick="sendTestNotification('transfer_status')"
            id="transferBtn"
            disabled
          >
            Transfer Status
          </button>
          <button
            onclick="sendTestNotification('urgent')"
            id="urgentBtn"
            disabled
          >
            Urgent Alert
          </button>
        </div>

        <div class="test-section">
          <h3>🎯 Advanced Tests</h3>
          <button
            onclick="sendMultipleNotifications()"
            id="multipleBtn"
            disabled
          >
            Multiple (5)
          </button>
          <button onclick="sendRapidNotifications()" id="rapidBtn" disabled>
            Rapid (10)
          </button>
          <button onclick="testReconnection()" id="reconnectBtn" disabled>
            Test Reconnection
          </button>
        </div>
      </div>

      <div>
        <h3>📊 Event Log</h3>
        <div id="log" class="log">Waiting for events...\n</div>
        <button onclick="clearLog()">Clear Log</button>
        <button onclick="exportLog()">Export Log</button>
      </div>
    </div>

    <script>
      let token = null;
      let eventSource = null;
      let isConnected = false;
      let messageCount = 0;
      let notificationCount = 0;
      let logEntries = [];

      function updateStatus(message, type = "info") {
        const statusEl = document.getElementById("status");
        statusEl.textContent = message;
        statusEl.className = `status ${type}`;
      }

      function log(message, level = "info") {
        const logEl = document.getElementById("log");
        const timestamp = new Date().toLocaleTimeString();
        const entry = {
          timestamp,
          message,
          level,
        };
        logEntries.push(entry);

        const logEntry = document.createElement("div");
        logEntry.className = `log-entry log-${level}`;
        logEntry.innerHTML = `
                <span class="log-timestamp">[${timestamp}]</span>
                <span class="log-message">${message}</span>
            `;

        logEl.appendChild(logEntry);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function clearLog() {
        document.getElementById("log").innerHTML = "Log cleared...\n";
        logEntries = [];
      }

      function exportLog() {
        const logText = logEntries
          .map((entry) => `[${entry.timestamp}] ${entry.message}`)
          .join("\n");

        const blob = new Blob([logText], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `sse-test-log-${new Date()
          .toISOString()
          .slice(0, 19)}.txt`;
        a.click();
        URL.revokeObjectURL(url);
      }

      function updateStats() {
        document.getElementById("connectionCount").textContent = isConnected
          ? "1"
          : "0";
        document.getElementById("messageCount").textContent = messageCount;
        document.getElementById("notificationCount").textContent =
          notificationCount;
      }

      async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (!email || !password) {
          updateStatus("Please enter email and password", "error");
          return;
        }

        try {
          updateStatus("Logging in...", "info");
          log("Attempting login...");

          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email, password }),
            credentials: "include",
          });

          if (response.ok) {
            const data = await response.json();
            token = "authenticated";
            updateStatus("Login successful!", "success");
            log(
              `Login successful: ${data.user.firstName} ${data.user.lastName} (${data.user.userType})`,
              "success"
            );
            document.getElementById("connectBtn").disabled = false;
          } else {
            const error = await response.json();
            updateStatus(
              `Login failed: ${error.message || "Unknown error"}`,
              "error"
            );
            log(`Login failed: ${error.message || "Unknown error"}`, "error");
          }
        } catch (error) {
          updateStatus(`Login error: ${error.message}`, "error");
          log(`Login error: ${error.message}`, "error");
        }
      }

      function logout() {
        token = null;
        if (eventSource) {
          disconnectSSE();
        }
        updateStatus("Logged out", "info");
        document.getElementById("connectBtn").disabled = true;
        disableAllButtons();
        log("Logged out");
      }

      function connectSSE() {
        if (!token) {
          updateStatus("Please login first", "error");
          return;
        }

        if (eventSource) {
          updateStatus("SSE connection already exists", "warning");
          return;
        }

        try {
          updateStatus("Connecting to SSE...", "info");
          log("Attempting to connect to SSE endpoint...");

          eventSource = new EventSource("/api/notifications/sse", {
            withCredentials: true,
          });

          eventSource.onopen = function (event) {
            isConnected = true;
            updateStatus("SSE connection established!", "success");
            log("SSE connection opened successfully", "success");
            document.getElementById("connectBtn").disabled = true;
            document.getElementById("disconnectBtn").disabled = false;
            document.getElementById("statusBtn").disabled = false;
            enableAllButtons();
            updateStats();
          };

          eventSource.onmessage = function (event) {
            try {
              const data = JSON.parse(event.data);
              messageCount++;
              log(`Message received: ${data.type}`, "info");

              if (data.type === "connection") {
                log("Connection confirmed by server", "success");
              } else if (data.type === "heartbeat") {
                log("Heartbeat received", "info");
              } else {
                log(`Notification: ${data.title} - ${data.message}`, "success");
                showNotificationPopup(data);
                notificationCount++;
              }

              updateStats();
            } catch (error) {
              log(`Error parsing message: ${error.message}`, "error");
              log(`Raw data: ${event.data}`, "error");
            }
          };

          eventSource.onerror = function (event) {
            log(`SSE connection error: ${event.type}`, "error");
            if (eventSource.readyState === EventSource.CLOSED) {
              isConnected = false;
              updateStatus("SSE connection closed", "error");
              document.getElementById("connectBtn").disabled = false;
              document.getElementById("disconnectBtn").disabled = true;
              document.getElementById("statusBtn").disabled = true;
              disableAllButtons();
              updateStats();
            }
          };
        } catch (error) {
          updateStatus(`SSE connection failed: ${error.message}`, "error");
          log(`SSE connection error: ${error.message}`, "error");
        }
      }

      function disconnectSSE() {
        if (eventSource) {
          eventSource.close();
          eventSource = null;
          isConnected = false;
          updateStatus("SSE connection closed", "info");
          log("SSE connection manually closed");
          document.getElementById("connectBtn").disabled = false;
          document.getElementById("disconnectBtn").disabled = true;
          document.getElementById("statusBtn").disabled = true;
          disableAllButtons();
          updateStats();
        }
      }

      function testConnection() {
        if (!isConnected) {
          updateStatus("Please connect to SSE first", "error");
          return;
        }

        log("Testing connection by sending a test notification...");
        sendTestNotification("test");
      }

      async function checkStatus() {
        if (!token) {
          updateStatus("Please login first", "error");
          return;
        }

        try {
          log("Checking SSE connection status...");

          const response = await fetch("/api/notifications/status", {
            method: "GET",
            credentials: "include",
          });

          if (response.ok) {
            const data = await response.json();
            log(
              `📊 SSE Status: ${data.stats.totalConnections} total connections`,
              "success"
            );
            log(
              `📊 Connections by type: ${JSON.stringify(
                data.stats.connectionsByType
              )}`,
              "info"
            );
            if (data.stats.clientIds && data.stats.clientIds.length > 0) {
              log(
                `📊 Connected client IDs: ${data.stats.clientIds.join(", ")}`,
                "info"
              );
            }
            updateStatus(
              `SSE Status: ${data.stats.totalConnections} connections active`,
              "success"
            );
          } else {
            log(`❌ Failed to get status: ${response.status}`, "error");
          }
        } catch (error) {
          log(`❌ Status check error: ${error.message}`, "error");
        }
      }

      async function sendTestNotification(type) {
        if (!token) {
          updateStatus("Please login first", "error");
          return;
        }

        try {
          log(`Sending ${type} notification...`);

          const response = await fetch("/api/test-notifications", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            credentials: "include",
            body: JSON.stringify({
              notificationType: type,
            }),
          });

          if (response.ok) {
            const data = await response.json();
            log(`✅ ${type} notification sent: ${data.message}`, "success");
          } else {
            log(`❌ ${type} notification failed: ${response.status}`, "error");
          }
        } catch (error) {
          log(`❌ ${type} notification error: ${error.message}`, "error");
        }
      }

      async function sendMultipleNotifications() {
        log("Sending 5 notifications with 1 second intervals...");
        for (let i = 1; i <= 5; i++) {
          setTimeout(() => {
            sendTestNotification("test");
            log(`Sent notification ${i}/5`);
          }, i * 1000);
        }
      }

      async function sendRapidNotifications() {
        log("Sending 10 rapid notifications...");
        for (let i = 1; i <= 10; i++) {
          setTimeout(() => {
            sendTestNotification("test");
            log(`Sent rapid notification ${i}/10`);
          }, i * 200);
        }
      }

      function testReconnection() {
        if (!isConnected) {
          updateStatus("Please connect to SSE first", "error");
          return;
        }

        log("Testing reconnection by disconnecting and reconnecting...");
        disconnectSSE();

        setTimeout(() => {
          log("Attempting reconnection...");
          connectSSE();
        }, 2000);
      }

      function enableAllButtons() {
        const buttons = [
          "testBtn",
          "basicBtn",
          "transferBtn",
          "urgentBtn",
          "multipleBtn",
          "rapidBtn",
          "reconnectBtn",
        ];
        buttons.forEach((id) => {
          document.getElementById(id).disabled = false;
        });
      }

      function disableAllButtons() {
        const buttons = [
          "testBtn",
          "basicBtn",
          "transferBtn",
          "urgentBtn",
          "multipleBtn",
          "rapidBtn",
          "reconnectBtn",
        ];
        buttons.forEach((id) => {
          document.getElementById(id).disabled = true;
        });
      }

      function showNotificationPopup(data) {
        const popup = document.createElement("div");
        popup.className = "notification-popup";

        const priorityColors = {
          high: "#dc3545",
          medium: "#ffc107",
          low: "#28a745",
        };

        const color = priorityColors[data.priority] || "#667eea";
        popup.style.borderLeftColor = color;

        popup.innerHTML = `
                <button class="close-btn" onclick="this.parentElement.remove()">×</button>
                <div class="notification-title">${data.title}</div>
                <div class="notification-message">${data.message}</div>
                <div class="notification-time">${new Date().toLocaleTimeString()}</div>
            `;

        document.body.appendChild(popup);

        // Auto-remove after 5 seconds
        setTimeout(() => {
          if (popup.parentElement) {
            popup.remove();
          }
        }, 5000);
      }

      // Initialize
      document.getElementById("connectBtn").disabled = true;
      document.getElementById("disconnectBtn").disabled = true;
      document.getElementById("statusBtn").disabled = true;
      disableAllButtons();
      updateStats();

      log("SSE Live Test initialized. Please login to begin testing.");
    </script>
  </body>
</html>
